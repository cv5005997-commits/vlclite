name: Build VLC Lite APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project from uploaded ZIP
        run: |
          mkdir -p _vlclite_src
          unzip -o VLCLite-reconstruccion-inicial.zip -d _vlclite_src
          test -f _vlclite_src/settings.gradle.kts
          cp -R _vlclite_src/. .
          sed -i 's/Media(libVLC, /Media(libVLC ?: throw IllegalStateException("Motor no inicializado"), /' app/src/main/java/com/vlclite/player/MainActivity.kt

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VLCLite-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
